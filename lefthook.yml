pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "^legacy/"
      run: bun oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: "*.{js,ts,jsx,tsx,md,css,yml,yaml,json}"
      exclude: "^legacy/"
      run: bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
