name: LocaLoco CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Run format check
        run: bun run format:check
      - name: Run lint
        run: bun run lint:check
      - name: Run typecheck
        run: bun run type:check
      - name: Run production build
        run: bun run build
      - name: Run unit and integration tests
        run: bun run test
      - name: Install Playwright browsers
        run: bunx playwright install chromium
      - name: Run e2e tests
        run: bun run test:e2e
      - name: Run dependency audit
        run: bun run security:audit
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build container image
        run: docker build -t localoco:gate .
  terraform-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=infra init -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate -no-color
      - name: Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra plan -no-color -lock=false -out plan.tfplan
