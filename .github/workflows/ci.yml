name: LocaLoco CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-checks:
    name: Run quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Run format check
        run: bun run format:check
      - name: Run lint
        run: bun run lint:check
      - name: Run typecheck
        run: bun run type:check
      - name: Run production build
        run: bun run build
      - name: Check schema and migration history for drift
        run: bunx drizzle-kit check
      - name: Run dependency audit
        run: bun run security:audit
  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
      - name: Run unit tests
        run: bun run test:unit
  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
      - name: Run integration tests
        run: bun run test:integration
  e2e-test:
    name: Run E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BETTER_AUTH_SECRET: local-e2e-secret-at-least-32-chars-long
      VITE_APP_URL: http://localhost:4001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
      - name: Build app for SPA shell/assets
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install chromium
      - name: Run e2e tests
        run: bun run test:e2e

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build container image
        run: docker build -t localoco:gate .
  terraform-checks:
    name: Run Terraform checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=infra init -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate -no-color
      - name: Terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra plan -no-color -lock=false -out plan.tfplan
