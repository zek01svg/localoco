name: CD — protected production release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose published image digest to release (branch or SHA)
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  statuses: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  PROJECT_ID: localoco-505304
  REGION: asia-southeast1
  SERVICE: localoco
  IMAGE: ghcr.io/zek01svg/localoco

jobs:
  resolve-digest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.status.outputs.digest }}
      image: ${{ steps.status.outputs.image }}
    steps:
      - name: Resolve published image digest
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest="$(gh api "repos/${{ github.repository }}/commits/${{ inputs.sha }}/status" \
            --jq '.statuses[] | select(.context == "ghcr/image" and .state == "success") | .description' \
            | tail -n 1)"
          if [ -z "$digest" ]; then
            echo "::error::No successful ghcr/image status found for '${{ inputs.sha }}'. Publish the image first (merge to main)."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE }}@$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ env.IMAGE }}@$digest"

  terraform-apply:
    runs-on: ubuntu-latest
    needs: resolve-digest
    environment: production
    outputs:
      hold_revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Pin currently serving revision
        id: pin
        run: |
          hold="$(gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" --format=json \
            | jq -r '.status.traffic[] | select(.percent > 0) | .revision')"
          echo "revision=$hold" >> "$GITHUB_OUTPUT"
          echo "Holding revision: $hold"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan (stage exact digest at 0% traffic)
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=infra plan -no-color \
            -var "origin_image=${{ needs.resolve-digest.outputs.image }}" \
            -var "origin_traffic_hold=${{ steps.pin.outputs.revision }}" \
            -var "origin_traffic_latest=0" \
            -out plan.tfplan

      - name: Terraform apply (approved step)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra apply -no-color plan.tfplan

  migrate:
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install production dependencies (frozen)
        run: bun install --production --frozen-lockfile

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read DATABASE_URL from Secret Manager
        id: secret
        run: |
          url="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="${{ env.PROJECT_ID }}")"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run committed migrations (direct connection)
        env:
          DATABASE_URL: ${{ steps.secret.outputs.url }}
        run: bun run db:migrate

  smoke:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Locate zero-traffic revision URL
        id: target
        run: |
          json="$(gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" --format=json)"
          url="$(echo "$json" | jq -r '.status.traffic[] | select(.percent == 0 and .url != "") | .url' | head -n 1)"
          revision="$(echo "$json" | jq -r '.status.traffic[] | select(.percent == 0 and .url != "") | .revision' | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::No zero-traffic revision URL found"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Smoke target: $url ($revision)"

      - name: Read SMOKE_TOKEN from Secret Manager
        id: secret
        run: |
          token="$(gcloud secrets versions access latest --secret=SMOKE_TOKEN --project="${{ env.PROJECT_ID }}")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Smoke check zero-traffic revision
        env:
          SMOKE_TOKEN: ${{ steps.secret.outputs.token }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ steps.target.outputs.url }}/health"
          echo ""
          response="$(curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" \
            "${{ steps.target.outputs.url }}/api/smoke")"
          echo "$response"
          served="$(echo "$response" | jq -r '.revision')"
          if [ "${{ steps.target.outputs.revision }}" != "$served" ]; then
            echo "::error::Smoke hit revision '$served', expected staged revision '${{ steps.target.outputs.revision }}'"
            exit 1
          fi

  promote:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan (atomic promotion)
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform -chdir=infra plan -no-color \
            -var "origin_image=${{ needs.resolve-digest.outputs.image }}" \
            -var "origin_traffic_latest=100" \
            -out plan.tfplan

      - name: Terraform apply (promote traffic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=infra apply -no-color plan.tfplan

      - name: Record release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Release ${{ needs.resolve-digest.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ needs.resolve-digest.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous serving revision: \`${{ needs.terraform-apply.outputs.hold_revision }}\` (retained for rollback)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Traffic: 100% to latest, atomic promotion" >> "$GITHUB_STEP_SUMMARY"
